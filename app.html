<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROM Corrupter</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ROM Corrupter">
<meta name="theme-color" content="#141413">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23c2362b'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' font-family='monospace' fill='white'%3E%3F%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f3ef;--fg:#1d1c1a;--mut:#6a665f;--card:#fff;--bd:#d8d4cb;--ac:#c2362b;--acfg:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--fg:#ecebe6;--mut:#9b978f;--card:#1e1d1b;--bd:#35332f;--ac:#e0584c;--acfg:#14110f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--fg:#ecebe6;--mut:#9b978f;--card:#1e1d1b;--bd:#35332f;--ac:#e0584c;--acfg:#14110f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 16px 40px}
main{max-width:560px;margin:0 auto}
h1{font:700 1.5rem/1.2 ui-monospace,Menlo,Consolas,monospace;margin:0 0 4px}
p.s{color:var(--mut);margin:0 0 18px;font-size:.9rem}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.8rem;color:var(--mut);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
label:first-child{margin-top:0}
select,input[type=text],input[type=file]{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px}
input[type=range]{width:100%;accent-color:var(--ac)}
.r{display:flex;gap:8px}
button{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);padding:10px 14px;cursor:pointer}
button.p{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
button:disabled{opacity:.45;cursor:default}
.k{font:.85rem/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--mut);margin-top:10px;word-break:break-word}
canvas{width:100%;height:28px;display:block;margin-top:10px;border-radius:6px;background:var(--bg);border:1px solid var(--bd)}
.n{font-size:.8rem;color:var(--mut)}
#pl{position:fixed;inset:0;background:#000;z-index:9;display:none;touch-action:none;user-select:none;-webkit-user-select:none;color:#fff}
#pl.on{display:block}
#cv{position:absolute;top:env(safe-area-inset-top,0px);left:50%;transform:translateX(-50%);width:min(100vw,106.6vh);aspect-ratio:256/240;height:auto;image-rendering:pixelated;background:#111}
#pl[data-m=snes] .tc,#pl[data-m=snes] #cv{display:none}
#ps{position:absolute;left:8px;top:calc(8px + env(safe-area-inset-top,0px));font:.75rem ui-monospace,monospace;opacity:.8;max-width:55%;z-index:2}
#pb{position:absolute;right:8px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:6px;z-index:2}
.tc{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));opacity:.6;z-index:2}
#dp{left:22px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4)}
#ab{right:22px;display:flex;gap:16px;align-items:flex-end}
#ss{left:50%;transform:translateX(-50%);display:flex;gap:12px;bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.bt{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.45);font:700 20px ui-monospace,monospace;display:flex;align-items:center;justify-content:center;touch-action:none}
#bA{margin-bottom:36px}
.sb{width:auto;height:auto;padding:8px 14px;border-radius:14px;font-size:12px}
</style></head>
<body><main>
<h1>ROM CORRUPTER</h1>
<p class="s">NES + SNES glitch tool. Works offline, nothing is uploaded. Use ROMs you own.</p>

<div class="c">
<label for="f">ROM file (.nes / .sfc / .smc)</label>
<input type="file" id="f">
<div class="k" id="inf">No file loaded.</div>
</div>

<div class="c" id="ctl" hidden>
<label for="reg">Region</label><select id="reg"></select>
<label for="mode">Corruption mode</label>
<select id="mode">
<option value="mix">Chaos mix</option>
<option value="rand">Random bytes</option>
<option value="flip">Bit flips</option>
<option value="step">Nudge +1 / −1</option>
<option value="swap">Swap neighbours</option>
<option value="fill">Fill runs (00 / FF)</option>
<option value="copy">Copy blocks</option>
</select>
<label for="amt">Intensity: <span id="pct"></span></label>
<input type="range" id="amt" min="-3" max="1" step="0.05" value="-1.5">
<label for="seed">Seed</label>
<div class="r"><input type="text" id="seed" autocapitalize="off" autocomplete="off"><button id="roll" type="button">Re-roll</button></div>
<canvas id="map" width="512" height="28"></canvas>
<div class="k" id="stat"></div>
</div>

<div class="c" id="sv" hidden>
<button class="p" id="bp" type="button" style="width:100%;margin-bottom:8px">▶ Play corrupted game</button>
<div class="r"><button class="p" id="bz" type="button" style="flex:1">Save corrupted ROM</button><button id="bt" type="button" style="flex:1">Share</button></div>
<p class="n" style="margin:10px 0 0">Header bytes are never touched. Many corruptions just crash, so keep re-rolling or lower the intensity.</p>
<div class="k" id="msg"></div>
</div>
</main>
<div id="pl" data-m="nes">
<canvas id="cv" width="256" height="240"></canvas>
<iframe id="sf" hidden allow="gamepad; autoplay; fullscreen" style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe>
<div id="ps"></div>
<div id="pb"><button id="px2" type="button">New glitch</button><button id="pc" type="button">Close</button></div>
<div class="tc" id="dp"></div>
<div class="tc" id="ab"><div class="bt" id="bB" data-b="1">B</div><div class="bt" id="bA" data-b="0">A</div></div>
<div class="tc" id="ss"><div class="bt sb" data-b="2">SELECT</div><div class="bt sb" data-b="3">START</div></div>
</div>
<script src="jsnes.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let rom=null,info=null,out=null,name='rom.bin';

function detect(b,fn){
  const ext=fn.split('.').pop().toLowerCase();
  if(b[0]==0x4E&&b[1]==0x45&&b[2]==0x53&&b[3]==0x1A){
    const hdr=16+(b[6]&4?512:0),prg=b[4]*16384,chr=b[5]*8192;
    const r=[['Whole ROM (skip header)',hdr,b.length-hdr]];
    if(prg&&hdr+prg<=b.length)r.push(['PRG only (code: crashes, odd behaviour)',hdr,prg]);
    if(chr&&hdr+prg+chr<=b.length)r.push(['CHR only (graphics glitches)',hdr+prg,chr]);
    return{sys:'NES (iNES)'+(chr?'':', CHR-RAM'),hdr,regions:r};
  }
  const hdr=b.length%1024==512?512:0;
  const snes=['sfc','smc','swc','fig'].includes(ext)||hdr==512||b.length%32768==0;
  return{sys:snes?'SNES'+(hdr?' (512-byte copier header)':''):'Unknown format (treated as raw)',hdr,regions:[['Whole ROM'+(hdr?' (skip header)':''),hdr,b.length-hdr]]};
}

function rng(s){
  let h=1779033703^s.length;
  for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  let a=h|0;
  return()=>{a=(a+0x6D2B79F5)|0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}
}

function run(){
  if(!rom)return;
  const[,st,len]=info.regions[+$('reg').value],end=st+len;
  const R=rng($('seed').value),pct=Math.pow(10,+$('amt').value);
  $('pct').textContent=(pct<1?pct.toFixed(3):pct.toFixed(1))+'% of region';
  const n=Math.max(1,Math.round(len*pct/100)),m=$('mode').value;
  const modes=['rand','flip','step','swap','fill','copy'];
  out=rom.slice();
  for(let k=0;k<n;k++){
    const md=m=='mix'?modes[Math.floor(R()*modes.length)]:m;
    const i=st+Math.floor(R()*len);
    if(md=='rand')out[i]=R()*256;
    else if(md=='flip')out[i]^=1<<Math.floor(R()*8);
    else if(md=='step')out[i]+=R()<.5?1:-1;
    else if(md=='swap'){if(i+1<end){const t=out[i];out[i]=out[i+1];out[i+1]=t}}
    else if(md=='fill'){out.fill(R()<.5?0:255,i,Math.min(i+1+Math.floor(R()*16),end))}
    else if(md=='copy'){const s=st+Math.floor(R()*len),e=Math.min(1+Math.floor(R()*32),end-s,end-i);if(e>0)out.set(rom.subarray(s,s+e),i)}
  }
  const B=new Uint32Array(512);let d=0;
  for(let i=0;i<rom.length;i++)if(rom[i]!==out[i]){d++;B[Math.floor(i*512/rom.length)]++}
  $('stat').textContent=d.toLocaleString()+' of '+rom.length.toLocaleString()+' bytes changed';
  const cv=$('map'),x=cv.getContext('2d');
  x.clearRect(0,0,512,28);
  x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--ac');
  const mx=Math.max(1,...B);
  for(let i=0;i<512;i++)if(B[i]){const h=Math.max(3,28*Math.sqrt(B[i]/mx));x.fillRect(i,28-h,1,h)}
}

function newSeed(){$('seed').value=Math.random().toString(36).slice(2,8)}
function msg(t){$('msg').textContent=t}

$('f').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    rom=new Uint8Array(await f.arrayBuffer());name=f.name;info=detect(rom,name);
    $('inf').textContent=name+' · '+(rom.length/1024).toFixed(0)+' KB · '+info.sys+' · header '+info.hdr+' B';
    $('reg').innerHTML='';
    info.regions.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=r[0];$('reg').appendChild(o)});
    $('ctl').hidden=false;$('sv').hidden=false;msg('');newSeed();run();
  }catch(err){$('inf').textContent='Could not read that file.'}
});
['reg','mode','amt','seed'].forEach(id=>$(id).addEventListener('input',run));
$('roll').addEventListener('click',()=>{newSeed();run()});

function fname(){
  const i=name.lastIndexOf('.'),base=(i>0?name.slice(0,i):name),ext=i>0?name.slice(i):'.bin';
  const sd=($('seed').value.replace(/[^a-z0-9]/gi,'')||'x').slice(0,12);
  return base+'_corrupt_'+sd+ext;
}
const native=()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
async function nativeSave(){
  try{
    const P=window.Capacitor.Plugins;let bin='';
    for(let i=0;i<out.length;i+=0x8000)bin+=String.fromCharCode.apply(null,out.subarray(i,i+0x8000));
    const r=await P.Filesystem.writeFile({path:fname(),data:btoa(bin),directory:'CACHE'});
    await P.Share.share({title:fname(),url:r.uri});
    msg('Pick "Save to Files" or an emulator app.');
  }catch(e){if(!e||!/cancel/i.test(String(e.message||e)))msg('Could not save: '+(e&&e.message||e))}
}
function save(){
  if(!out)return;
  if(native())return nativeSave();
  const url=URL.createObjectURL(new Blob([out],{type:'application/octet-stream'}));
  const a=document.createElement('a');a.href=url;a.download=fname();
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  msg('Saved as '+fname());
}
async function share(){
  if(!out)return;
  if(native())return nativeSave();
  try{
    const f=new File([out],fname(),{type:'application/octet-stream'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});msg('Shared.')}
    else{save()}
  }catch(e){if(!e||e.name!=='AbortError')save()}
}
$('bz').addEventListener('click',save);
$('bt').addEventListener('click',share);

/* ---- player: NES via jsnes, SNES via EmulatorJS (online) ---- */
let nes=null,raf=0,ac=null,last=0,acc=0,blobUrl='';
const AL=new Float32Array(8192),AR=new Float32Array(8192);let aw=0,ar=0;
const srcs={t:{},k:{},g:{}},cur={};
const status=t=>{$('ps').textContent=t};
function set(s,b,on){srcs[s][b]=on;const a=!!(srcs.t[b]||srcs.k[b]||srcs.g[b]);if(!nes||a===!!cur[b])return;cur[b]=a;a?nes.buttonDown(1,b):nes.buttonUp(1,b)}
function audioOn(){
  if(ac){ac.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  ac=new AC();const sp=ac.createScriptProcessor(1024,0,2);
  sp.onaudioprocess=e=>{const L=e.outputBuffer.getChannelData(0),R=e.outputBuffer.getChannelData(1);
    for(let i=0;i<L.length;i++){if(ar<aw){L[i]=AL[ar&8191];R[i]=AR[ar&8191];ar++}else{L[i]=R[i]=0}}};
  sp.connect(ac.destination);
}
function bin(u){let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return s}
function stopP(){
  cancelAnimationFrame(raf);raf=0;nes=null;
  for(const k in cur)cur[k]=false;
  $('sf').hidden=true;$('sf').srcdoc='';
  if(blobUrl){URL.revokeObjectURL(blobUrl);blobUrl=''}
}
function closeP(){stopP();$('pl').classList.remove('on');if(ac)ac.suspend()}
function loop(t){
  raf=requestAnimationFrame(loop);poll();
  acc=Math.min(acc+t-last,100);last=t;
  try{while(acc>=16.64){nes.frame();acc-=16.64}}
  catch(e){cancelAnimationFrame(raf);raf=0;status('Crashed: '+(e.message||e)+' (tap New glitch)')}
}
function playNES(){
  if(typeof jsnes==='undefined'){msg('NES engine missing. Re-run the build so jsnes.min.js gets bundled.');return}
  stopP();audioOn();aw=ar=0;
  const ctx=$('cv').getContext('2d'),img=ctx.createImageData(256,240),u32=new Uint32Array(img.data.buffer);
  try{
    nes=new jsnes.NES({
      onFrame:f=>{for(let i=0;i<61440;i++)u32[i]=0xFF000000|f[i];ctx.putImageData(img,0,0)},
      onAudioSample:(l,r)=>{if(aw-ar>8000)ar=aw-2000;AL[aw&8191]=l;AR[aw&8191]=r;aw++},
      sampleRate:ac?ac.sampleRate:44100});
    nes.loadROM(bin(out));
  }catch(e){nes=null;msg('Cannot start this ROM: '+(e.message||e));return}
  $('pl').dataset.m='nes';$('pl').classList.add('on');
  status('Seed '+$('seed').value+' · '+(navigator.getGamepads&&[...navigator.getGamepads()].some(g=>g)?'controller ready':'press a controller button to connect'));
  last=performance.now();acc=0;raf=requestAnimationFrame(loop);
}
function playSNES(){
  stopP();blobUrl=URL.createObjectURL(new Blob([out]));
  $('sf').srcdoc='<!doctype html><body style="margin:0;background:#000"><div id="g" style="width:100vw;height:100vh"></div><script>EJS_player="#g";EJS_core="snes";EJS_gameUrl="'+blobUrl+'";EJS_gameName="glitch";EJS_pathtodata="https://cdn.emulatorjs.org/stable/data/";EJS_startOnLoaded=true;<\/script><script src="https://cdn.emulatorjs.org/stable/data/loader.js"><\/script>';
  $('sf').hidden=false;$('pl').dataset.m='snes';$('pl').classList.add('on');
  status('Seed '+$('seed').value+' · loading SNES core (needs internet)');
}
function play(){
  if(!out)return;
  if(info.sys.startsWith('NES'))playNES();
  else if(info.sys.startsWith('SNES'))playSNES();
  else msg('Only NES and SNES ROMs can be played.');
}
/* controls: touch, keyboard, Bluetooth/USB gamepad */
document.querySelectorAll('.bt[data-b]').forEach(el=>{
  const b=+el.dataset.b;
  el.addEventListener('pointerdown',e=>{e.preventDefault();set('t',b,true)});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,()=>set('t',b,false)));
});
const dp=$('dp');
function dir(e){const r=dp.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  set('t',6,x<-.15);set('t',7,x>.15);set('t',4,y<-.15);set('t',5,y>.15)}
const dpOff=()=>[4,5,6,7].forEach(b=>set('t',b,false));
dp.addEventListener('pointerdown',e=>{e.preventDefault();dp.setPointerCapture(e.pointerId);dir(e)});
dp.addEventListener('pointermove',e=>{if(dp.hasPointerCapture(e.pointerId))dir(e)});
['pointerup','pointercancel'].forEach(t=>dp.addEventListener(t,dpOff));
const KM={ArrowUp:4,ArrowDown:5,ArrowLeft:6,ArrowRight:7,KeyX:0,KeyZ:1,ShiftLeft:2,ShiftRight:2,Enter:3};
['keydown','keyup'].forEach(t=>addEventListener(t,e=>{if(nes&&e.code in KM){e.preventDefault();set('k',KM[e.code],t=='keydown')}}));
function poll(){
  const g=[...(navigator.getGamepads?navigator.getGamepads():[])].find(x=>x&&x.connected);
  if(!g){for(let b=0;b<8;b++)set('g',b,false);return}
  const p=i=>!!(g.buttons[i]&&g.buttons[i].pressed),ax=g.axes[0]||0,ay=g.axes[1]||0;
  set('g',0,p(0)||p(1));set('g',1,p(2)||p(3));set('g',2,p(8));set('g',3,p(9));
  set('g',4,p(12)||ay<-.5);set('g',5,p(13)||ay>.5);set('g',6,p(14)||ax<-.5);set('g',7,p(15)||ax>.5);
}
addEventListener('gamepadconnected',e=>status('Controller: '+e.gamepad.id.slice(0,40)));
$('bp').addEventListener('click',play);
$('px2').addEventListener('click',()=>{newSeed();run();play()});
$('pc').addEventListener('click',closeP);
</script>
</body></html>
