name: Build all

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ejs-pack:
    name: Offline systems pack
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-save playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: node fetch-ejs.js
      - uses: actions/upload-artifact@v4
        with:
          name: ejs-pack
          path: |
            www/ejs
            www/ejs-pack.js
          if-no-files-found: ignore

  android:
    name: Android APK
    needs: ejs-pack
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - run: npm install
      - run: npm install jsnes@1.2.1 --no-save
      - name: Put the app page in place
        shell: bash
        run: |
          mkdir -p www
          cp app.html www/index.html
          cp node_modules/jsnes/dist/jsnes.min.js www/
          grep -c "Version 12" www/index.html
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ejs-pack
          path: www
      - run: npx cap add android
      - run: node patch-android.js
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ROM-Corruptor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  desktop:
    name: Windows, Linux and macOS
    needs: ejs-pack
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npm install jsnes@1.2.1 --no-save
      - name: Put the app page in place
        shell: bash
        run: |
          mkdir -p www
          cp app.html www/index.html
          cp node_modules/jsnes/dist/jsnes.min.js www/
          grep -c "Version 12" www/index.html
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ejs-pack
          path: www
      - if: runner.os == 'Windows'
        run: npm run dist:win
      - if: runner.os == 'Linux'
        run: npm run dist:linux
      - if: runner.os == 'macOS'
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.deb
            dist/*.AppImage
            dist/*.dmg

  ios:
    name: iOS unsigned IPA
    needs: ejs-pack
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npm install jsnes@1.2.1 --no-save
      - name: Put the app page in place
        shell: bash
        run: |
          mkdir -p www
          cp app.html www/index.html
          cp node_modules/jsnes/dist/jsnes.min.js www/
          grep -c "Version 12" www/index.html
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ejs-pack
          path: www
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Build unsigned app and package as .ipa
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ROMCorrupter-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: ios/App/ROMCorrupter-unsigned.ipa
