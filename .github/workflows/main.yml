name: Build all

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Hardened Dependencies
        run: |
          npm install
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0

      - name: Run Build Preparation
        run: |
          npm run build

      - name: Generate Native Android Directory Framework
        run: |
          npx cap init "Nexus Corruptor" "com.nexus.corruptor" --web-dir=www
          npx cap add android

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Compile Real Native Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-linux-desktop:
    name: Build Ubuntu & Debian Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Compile App Code
        run: |
          npm install
          npm run build

      - name: Build Debian and Ubuntu Installer Packages
        run: |
          mkdir -p build-linux/nexus-corruptor/usr/local/bin
          mkdir -p build-linux/nexus-corruptor/DEBIAN
          cat <<EOF > build-linux/nexus-corruptor/DEBIAN/control
          Package: nexus-corruptor
          Version: 1.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Developer <nexus@corruptor.local>
          Description: Universal Multi-System ROM and ISO Glitch Engine
          EOF
          if [ -d "www" ]; then cp -r www/* build-linux/nexus-corruptor/usr/local/bin/ || true; fi
          dpkg-deb --build build-linux/nexus-corruptor
          mv build-linux/nexus-corruptor.deb ./nexus-corruptor.deb

      - name: Upload Finished Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-Linux
          path: ./nexus-corruptor.deb

  build-windows:
    name: Build Windows Desktop EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Web Payload Package
        run: |
          npm install
          npm run build

      - name: Package Windows Portable Executable
        run: |
          mkdir desktop-dist
          tar -caf desktop-dist/NexusCorruptor-Windows.zip www/*
          
      - name: Upload Finished Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-Windows
          path: desktop-dist/NexusCorruptor-Windows.zip

  build-ios:
    name: Build iOS Package (IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Code dependencies
        run: |
          npm install
          npm run build

      - name: Package iOS Web Bundle Frame
        run: |
          mkdir -p ios-distribution
          tar -caf ios-distribution/NexusCorruptor-iOS-Unsigned.zip www/*

      - name: Upload Unsigned iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: ios-distribution/NexusCorruptor-iOS-Unsigned.zip
          
