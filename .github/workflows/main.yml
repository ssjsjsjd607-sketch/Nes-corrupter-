name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Run prepare script
        run: node prepare.js

      - name: Add Android platform (idempotent guard)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "android/ already exists, skipping cap add"
          fi

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Verify APK contains web assets
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" | grep -q "assets/public/index.html" \
            && echo "Web assets present" \
            || (echo "ERROR: APK missing web assets" && exit 1)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rom-corruptor-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
