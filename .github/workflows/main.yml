name: Build all

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ejs-pack:
    name: Offline systems pack
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Write the pack script
        run: |
          cat > fetch-ejs.js <<'EOF'
          // Runs in the cloud build (which has internet). It opens the EmulatorJS player once per system
          // and saves every file it downloads into www/ejs, so the app can run those systems offline.
          // If anything goes wrong it just exits without a pack and the app keeps working online.
          const { chromium } = require('playwright');
          const http = require('http'), fs = require('fs'), path = require('path');

          const CDN = 'https://cdn.emulatorjs.org/stable/data/';
          const OUT = path.join('www', 'ejs');
          const SYSTEMS = { nes: 'nes', snes: 'sfc', n64: 'z64', psx: 'iso', gba: 'gba', gb: 'gb', nds: 'nds', segaMD: 'md' };
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          (async () => {
            const server = http.createServer((req, res) => {
              const u = new URL(req.url, 'http://localhost');
              if (u.pathname.startsWith('/rom.')) {
                res.writeHead(200, { 'content-type': 'application/octet-stream' });
                return res.end(Buffer.alloc(1 << 17));
              }
              const core = u.searchParams.get('core') || 'nes', ext = SYSTEMS[core] || 'bin';
              res.writeHead(200, { 'content-type': 'text/html' });
              res.end('<!doctype html><body style="margin:0"><div id="g" style="width:640px;height:480px"></div><script>' +
                'EJS_player="#g";EJS_core="' + core + '";EJS_gameUrl="/rom.' + ext + '";EJS_gameName="x.' + ext + '";' +
                'EJS_pathtodata="' + CDN + '";EJS_startOnLoaded=true;</script><script src="' + CDN + 'loader.js"></script></body>');
            });
            await new Promise(r => server.listen(0, r));
            const port = server.address().port;
            const browser = await chromium.launch();
            const got = [], saved = new Set();

            for (const core of Object.keys(SYSTEMS)) {
              const ctx = await browser.newContext();          // fresh storage, so the core is really downloaded
              const page = await ctx.newPage();
              let last = Date.now(), coreFile = false;
              page.on('response', async r => {
                const u = r.url();
                if (!u.startsWith(CDN) || r.status() !== 200) return;
                last = Date.now();
                const rel = u.slice(CDN.length).split('?')[0].split('#')[0];
                if (/^cores\/.+\.data$/.test(rel)) coreFile = true;
                if (!rel || saved.has(rel)) return;
                saved.add(rel);
                try {
                  const f = path.join(OUT, rel);
                  fs.mkdirSync(path.dirname(f), { recursive: true });
                  fs.writeFileSync(f, await r.body());
                } catch (e) { console.log('skipped', rel, e.message); }
              });
              try { await page.goto('http://localhost:' + port + '/?core=' + core); }
              catch (e) { console.log('could not open', core, e.message); }
              const start = Date.now();
              while (Date.now() - last < 12000 && Date.now() - start < 180000) await sleep(1000);
              if (coreFile) got.push(core);
              console.log(core, coreFile ? 'saved' : 'no core file seen');
              await ctx.close();
            }

            await browser.close();
            server.close();
            if (got.length && fs.existsSync(path.join(OUT, 'loader.js'))) {
              fs.writeFileSync(path.join('www', 'ejs-pack.js'), 'window.EJS_PACK=' + JSON.stringify(got) + ';');
              console.log('offline pack ready for: ' + got.join(', '));
            } else {
              console.log('no offline pack was made');
            }
          })().catch(e => { console.log('fetch-ejs stopped:', e.message); });
          EOF
      - name: Install the browser the script uses
        continue-on-error: true
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Download the systems
        continue-on-error: true
        run: node fetch-ejs.js
      - uses: actions/upload-artifact@v4
        with:
          name: ejs-pack
          path: |
            www/ejs
            www/ejs-pack.js
          if-no-files-found: ignore

  android:
    name: Android APK
    needs: ejs-pack
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - run: npm install
      - run: npm install jsnes@1.2.1 --no-save
      - name: Put the app page in place
        shell: bash
        run: |
          mkdir -p www
          cp app.html www/index.html
          cp node_modules/jsnes/dist/jsnes.min.js www/
          grep -c "Version 12" www/index.html
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ejs-pack
          path: www
      - run: npx cap add android
      - run: node patch-android.js
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ROM-Corruptor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  desktop:
    name: Windows, Linux and macOS
    needs: ejs-pack
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npm install jsnes@1.2.1 --no-save
      - name: Put the app page in place
        shell: bash
        run: |
          mkdir -p www
          cp app.html www/index.html
          cp node_modules/jsnes/dist/jsnes.min.js www/
          grep -c "Version 12" www/index.html
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ejs-pack
          path: www
      - if: runner.os == 'Windows'
        run: npm run dist:win
      - if: runner.os == 'Linux'
        run: npm run dist:linux
      - if: runner.os == 'macOS'
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.deb
            dist/*.AppImage
            dist/*.dmg

  ios:
    name: iOS unsigned IPA
    needs: ejs-pack
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npm install jsnes@1.2.1 --no-save
      - name: Put the app page in place
        shell: bash
        run: |
          mkdir -p www
          cp app.html www/index.html
          cp node_modules/jsnes/dist/jsnes.min.js www/
          grep -c "Version 12" www/index.html
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ejs-pack
          path: www
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Build unsigned app and package as .ipa
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ROMCorrupter-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: ios/App/ROMCorrupter-unsigned.ipa
