<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ultra Corruptor</title>
    <script src="https://cdn.jsdelivr.net/npm/jsnes@1.2.1/dist/jsnes.min.js"></script>
    <style>
        body { background: #0a0a0f; color: #00f3ff; font-family: 'Courier New', monospace; text-align: center; margin: 0; padding: 0; overflow: hidden; touch-action: none; }
        #mainUI { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; padding: 20px; box-sizing: border-box; }
        .box { background: rgba(20, 20, 30, 0.9); border: 1px solid #00f3ff; padding: 20px; border-radius: 12px; box-shadow: 0 0 20px rgba(0,243,255,0.2); width: 100%; max-width: 400px; }
        h2 { text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px #00f3ff; }
        select, input, button { width: 100%; padding: 12px; margin: 8px 0; background: #000; color: #00f3ff; border: 1px solid #00f3ff; font-family: monospace; font-size: 14px; box-sizing: border-box; }
        button:active { background: #00f3ff; color: #000; }
        #log { font-size: 12px; color: #a7f3d0; margin-top: 10px; }
        
        /* Native Fullscreen Emulator */
        #gameContainer { display: none; flex-direction: column; height: 100vh; justify-content: space-between; background: #000; position: fixed; top: 0; left: 0; width: 100%; z-index: 100; }
        #canvasWrapper { flex-grow: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
        canvas { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
        
        /* On-Screen Controller */
        #controls { display: flex; justify-content: space-between; padding: 10px 20px 30px 20px; background: #111; border-top: 2px solid #00f3ff; user-select: none; }
        .dpad { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 5px; }
        .dpad button { background: #222; color: #fff; border: 1px solid #555; border-radius: 8px; font-size: 20px; padding: 0; margin: 0; }
        .dpad button:active { background: #00f3ff; color: #000; }
        .dpad .up { grid-column: 2; grid-row: 1; }
        .dpad .left { grid-column: 1; grid-row: 2; }
        .dpad .right { grid-column: 3; grid-row: 2; }
        .dpad .down { grid-column: 2; grid-row: 3; }
        
        .actions { display: grid; grid-template-columns: repeat(2, 60px); gap: 10px; align-items: end; }
        .actions button { background: #222; color: #00f3ff; border: 1px solid #00f3ff; border-radius: 50%; height: 60px; width: 60px; font-weight: bold; font-size: 16px; padding: 0; margin: 0; }
        .actions button:active { background: #00f3ff; color: #000; }
        .sys-btn { border-radius: 20px !important; height: 30px !important; width: 50px !important; font-size: 10px !important; margin-bottom: 10px !important;}
        
        #closeBtn { position: absolute; top: 10px; right: 10px; background: red; color: white; border: none; padding: 5px 10px; border-radius: 5px; font-weight: bold; z-index: 101; cursor: pointer;}
    </style>
</head>
<body>

    <div id="mainUI">
        <div class="box">
            <h2>Ultra Corruptor</h2>
            <label>1. ROM File</label>
            <input type="file" id="fileInput" accept=".nes">
            <label>2. Glitch Mode</label>
            <select id="mode">
                <option value="randomize">Randomize Bytes</option>
                <option value="zero">Zero-Out</option>
            </select>
            <button id="startBtn">Launch Game</button>
            <div id="log">Select a .nes file.</div>
        </div>
    </div>

    <div id="gameContainer">
        <button id="closeBtn">X</button>
        <div id="canvasWrapper">
            <canvas id="screen" width="256" height="240"></canvas>
        </div>
        <div id="controls">
            <div class="dpad">
                <button class="up" ontouchstart="press(4)" ontouchend="release(4)" onmousedown="press(4)" onmouseup="release(4)">▲</button>
                <button class="left" ontouchstart="press(6)" ontouchend="release(6)" onmousedown="press(6)" onmouseup="release(6)">◀</button>
                <button class="right" ontouchstart="press(7)" ontouchend="release(7)" onmousedown="press(7)" onmouseup="release(7)">▶</button>
                <button class="down" ontouchstart="press(5)" ontouchend="release(5)" onmousedown="press(5)" onmouseup="release(5)">▼</button>
            </div>
            <div class="actions">
                <div>
                    <button class="sys-btn" ontouchstart="press(2)" ontouchend="release(2)" onmousedown="press(2)" onmouseup="release(2)">SEL</button>
                    <button class="sys-btn" ontouchstart="press(3)" ontouchend="release(3)" onmousedown="press(3)" onmouseup="release(3)">STA</button>
                </div>
                <div>
                    <button ontouchstart="press(1)" ontouchend="release(1)" onmousedown="press(1)" onmouseup="release(1)">B</button>
                    <button ontouchstart="press(0)" ontouchend="release(0)" onmousedown="press(0)" onmouseup="release(0)">A</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let romBytes = null;
        let nes = null;
        let isRunning = false;
        
        const canvas = document.getElementById('screen');
        const ctx = canvas.getContext('2d');
        const imgData = ctx.createImageData(256, 240);
        const log = document.getElementById('log');

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                romBytes = new Uint8Array(ev.target.result);
                log.innerText = "Loaded: " + file.name;
            };
            reader.readAsArrayBuffer(file);
        });

        document.getElementById('startBtn').addEventListener('click', () => {
            if (!romBytes) return alert("Select a ROM file first!");
            const mode = document.getElementById('mode').value;
            let glitchedRom = new Uint8Array(romBytes);
            
            // Corrupt code (Skip NES header)
            for (let i = 16; i < glitchedRom.length; i++) {
                if (Math.random() > 0.95) {
                    if (mode === 'randomize') glitchedRom[i] = Math.floor(Math.random() * 256);
                    if (mode === 'zero') glitchedRom[i] = 0;
                }
            }
            playNES(glitchedRom);
        });

        function playNES(bytes) {
            document.getElementById('mainUI').style.display = 'none';
            document.getElementById('gameContainer').style.display = 'flex';
            isRunning = true;
            
            let romStr = "";
            for (let i = 0; i < bytes.length; i++) romStr += String.fromCharCode(bytes[i]);

            nes = new jsnes.NES({
                onFrame: (buffer) => {
                    for (let i = 0; i < 256 * 240; i++) {
                        let p = buffer[i];
                        imgData.data[i*4] = p & 0xFF;
                        imgData.data[i*4+1] = (p >> 8) & 0xFF;
                        imgData.data[i*4+2] = (p >> 16) & 0xFF;
                        imgData.data[i*4+3] = 255;
                    }
                    ctx.putImageData(imgData, 0, 0);
                },
                onAudioSample: () => {}
            });

            try {
                nes.loadROM(romStr);
                function loop() {
                    if (!isRunning) return;
                    // The Anti-Freeze Loop prevents the gray screen crash
                    try { nes.frame(); } catch(e) {} 
                    requestAnimationFrame(loop);
                }
                loop();
            } catch(e) {
                alert("ROM crashed on load. Try a different game.");
                closeGame();
            }
        }

        document.getElementById('closeBtn').addEventListener('click', closeGame);
        function closeGame() {
            isRunning = false;
            nes = null;
            document.getElementById('gameContainer').style.display = 'none';
            document.getElementById('mainUI').style.display = 'flex';
        }

        function press(btn) { if(nes) nes.buttonDown(1, btn); }
        function release(btn) { if(nes) nes.buttonUp(1, btn); }

        document.addEventListener('keydown', (e) => {
            if (!nes) return;
            if (e.key === 'ArrowUp') press(4);
            if (e.key === 'ArrowDown') press(5);
            if (e.key === 'ArrowLeft') press(6);
            if (e.key === 'ArrowRight') press(7);
            if (e.key === 'z') press(0);
            if (e.key === 'x') press(1);
            if (e.key === 'Enter') press(3);
        });
        document.addEventListener('keyup', (e) => {
            if (!nes) return;
            if (e.key === 'ArrowUp') release(4);
            if (e.key === 'ArrowDown') release(5);
            if (e.key === 'ArrowLeft') release(6);
            if (e.key === 'ArrowRight') release(7);
            if (e.key === 'z') release(0);
            if (e.key === 'x') release(1);
            if (e.key === 'Enter') release(3);
        });
    </script>
</body>
  </html>
