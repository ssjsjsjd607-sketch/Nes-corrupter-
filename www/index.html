<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple NES Corruptor</title>
    <script src="https://cdn.jsdelivr.net/npm/jsnes@1.2.1/dist/jsnes.min.js"></script>
    <style>
        body { background: #222; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        canvas { background: black; width: 100%; max-width: 400px; image-rendering: pixelated; margin-top: 20px; border: 2px solid white; }
        button, input { padding: 10px; margin: 10px; width: 80%; max-width: 300px; font-size: 16px; }
    </style>
</head>
<body>
    <h2>Simple NES Corruptor</h2>
    <input type="file" id="fileInput" accept=".nes">
    <br>
    <button id="startBtn">Corrupt & Play</button>
    <br>
    <canvas id="screen" width="256" height="240"></canvas>

    <script>
        let romBytes = null;
        let nes = null;
        const canvas = document.getElementById('screen');
        const ctx = canvas.getContext('2d');
        const imgData = ctx.createImageData(256, 240);

        // Load File
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                romBytes = new Uint8Array(ev.target.result);
                alert("ROM Loaded! Size: " + (romBytes.length/1024).toFixed(1) + " KB");
            };
            reader.readAsArrayBuffer(file);
        });

        // Corrupt and Play
        document.getElementById('startBtn').addEventListener('click', () => {
            if (!romBytes) return alert("Please select a .nes file first!");

            // Scramble 1% of the bytes
            let rom = new Uint8Array(romBytes);
            for (let i = 16; i < rom.length; i++) {
                if (Math.random() > 0.99) rom[i] = Math.floor(Math.random() * 256);
            }

            // Convert to string for jsnes
            let romStr = "";
            for (let i = 0; i < rom.length; i++) romStr += String.fromCharCode(rom[i]);

            // Setup Emulator
            nes = new jsnes.NES({
                onFrame: (buffer) => {
                    for (let i = 0; i < 256 * 240; i++) {
                        let p = buffer[i];
                        imgData.data[i*4] = p & 0xFF;
                        imgData.data[i*4+1] = (p >> 8) & 0xFF;
                        imgData.data[i*4+2] = (p >> 16) & 0xFF;
                        imgData.data[i*4+3] = 255;
                    }
                    ctx.putImageData(imgData, 0, 0);
                },
                onAudioSample: () => {}
            });

            nes.loadROM(romStr);
            
            // The Anti-Freeze Loop
            function loop() {
                try { nes.frame(); } catch(e) {} // Ignore crashes
                requestAnimationFrame(loop);
            }
            loop();
        });

        // Keyboard Controls
        document.addEventListener('keydown', (e) => {
            if (!nes) return;
            if (e.key === 'ArrowUp') nes.buttonDown(1, 4);
            if (e.key === 'ArrowDown') nes.buttonDown(1, 5);
            if (e.key === 'ArrowLeft') nes.buttonDown(1, 6);
            if (e.key === 'ArrowRight') nes.buttonDown(1, 7);
            if (e.key === 'z') nes.buttonDown(1, 0);
            if (e.key === 'x') nes.buttonDown(1, 1);
            if (e.key === 'Enter') nes.buttonDown(1, 3);
        });
        document.addEventListener('keyup', (e) => {
            if (!nes) return;
            if (e.key === 'ArrowUp') nes.buttonUp(1, 4);
            if (e.key === 'ArrowDown') nes.buttonUp(1, 5);
            if (e.key === 'ArrowLeft') nes.buttonUp(1, 6);
            if (e.key === 'ArrowRight') nes.buttonUp(1, 7);
            if (e.key === 'z') nes.buttonUp(1, 0);
            if (e.key === 'x') nes.buttonUp(1, 1);
            if (e.key === 'Enter') nes.buttonUp(1, 3);
        });
    </script>
</body>
</html>
