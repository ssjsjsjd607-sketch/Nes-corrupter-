<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NES Corruptor</title>
    
    <!-- Google Fonts for the Cool Theme -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- jsnes Emulator Library -->
    <script src="https://cdn.jsdelivr.net/npm/jsnes@1.2.1/dist/jsnes.min.js"></script>

    <style>
        /* =========================================
           THEME VARIABLES (Default: Cool Theme)
           ========================================= */
        :root {
            --bg: #0a0a0f;
            --bg-pattern: radial-gradient(circle at 15% 50%, rgba(0, 243, 255, 0.08), transparent 25%), radial-gradient(circle at 85% 30%, rgba(255, 0, 234, 0.08), transparent 25%);
            --panel: rgba(20, 20, 30, 0.85);
            --border: #2a2a3a;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #00f3ff;
            --accent-hover: #00c0cc;
            --btn-bg: linear-gradient(90deg, rgba(0,243,255,0.15), rgba(255,0,234,0.15));
            --btn-text: #00f3ff;
            --font-main: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --log-bg: #000000;
            --log-text: #a7f3d0;
            --shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }

        /* =========================================
           SIMPLE THEME OVERRIDES
           ========================================= */
        body.simple-theme {
            --bg: #f2f2f6;
            --bg-pattern: none;
            --panel: #ffffff;
            --border: #cccccc;
            --text: #111111;
            --text-muted: #666666;
            --accent: #007aff;
            --accent-hover: #005bb5;
            --btn-bg: #007aff;
            --btn-text: #ffffff;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: monospace;
            --log-bg: #f4f4f4;
            --log-text: #333333;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* =========================================
           GLOBAL STYLES
           ========================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            background-image: var(--bg-pattern);
            color: var(--text);
            font-family: var(--font-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Theme Toggle Button */
        #themeToggle {
            align-self: flex-end;
            max-width: 500px;
            margin-bottom: 10px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }
        #themeToggle:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .container {
            background: var(--panel);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        input[type="file"], select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: var(--log-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: var(--font-main);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="file"]:focus, select:focus {
            border-color: var(--accent);
        }

        input[type="file"]::file-selector-button {
            background: var(--border);
            color: var(--text);
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            margin-right: 10px;
            cursor: pointer;
        }

        button#playBtn {
            width: 100%;
            padding: 14px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: 1px solid var(--accent);
            border-radius: 8px;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.2s;
        }

        button#playBtn:hover {
            background: var(--accent);
            color: #000;
        }

        #log {
            font-family: var(--font-mono);
            background: var(--log-bg);
            color: var(--log-text);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            min-height: 40px;
            white-space: pre-wrap;
            border-left: 3px solid var(--accent);
            margin-bottom: 15px;
        }

        canvas {
            width: 100%;
            display: none;
            border: 1px solid var(--accent);
            border-radius: 8px;
            image-rendering: pixelated;
            background: #000;
            box-shadow: var(--shadow);
        }
    </style>
</head>
<body>

    <!-- Theme Toggle Button -->
    <button id="themeToggle">Switch to Simple GUI</button>

    <div class="container">
        <h1>NES Corruptor</h1>
        
        <label>1. Select ROM File</label>
        <input type="file" id="fileInput" accept=".nes">
        
        <label>2. Select Glitch Mode</label>
        <select id="engineSelect">
            <option value="randomize">Randomize Bytes</option>
            <option value="zero">Zero Out</option>
            <option value="swap">Byte Swap</option>
        </select>
        
        <button id="playBtn">Corrupt & Play</button>
        
        <div id="log">Ready. Please select a file.</div>
        
        <canvas id="nes-canvas" width="256" height="240"></canvas>
    </div>

    <script>
        // --- THEME SWITCHER LOGIC ---
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        // Check memory for saved theme
        const currentTheme = localStorage.getItem('appTheme');
        if (currentTheme === 'simple') {
            body.classList.add('simple-theme');
            themeToggle.innerText = "Switch to Cool GUI";
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('simple-theme');
            if (body.classList.contains('simple-theme')) {
                localStorage.setItem('appTheme', 'simple');
                themeToggle.innerText = "Switch to Cool GUI";
            } else {
                localStorage.setItem('appTheme', 'cool');
                themeToggle.innerText = "Switch to Simple GUI";
            }
        });

        // --- EMULATOR & CORRUPTION LOGIC ---
        let romBytes = null;
        const log = document.getElementById('log');
        const canvas = document.getElementById('nes-canvas');
        const ctx = canvas.getContext('2d');
        const imgData = ctx.createImageData(256, 240);
        let nes = null;

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            log.innerText = "Reading file...";
            const reader = new FileReader();
            reader.onload = (ev) => {
                romBytes = new Uint8Array(ev.target.result);
                log.innerText = `Loaded: ${file.name}\nSize: ${(romBytes.length/1024).toFixed(1)} KB`;
            };
            reader.readAsArrayBuffer(file);
        });

        function corrupt(bytes) {
            const mode = document.getElementById('engineSelect').value;
            let out = new Uint8Array(bytes);
            
            // Skip NES 16-byte header
            for (let i = 16; i < out.length; i++) {
                if (Math.random() > 0.95) { 
                    if (mode === 'randomize') out[i] = Math.floor(Math.random() * 256);
                    if (mode === 'zero') out[i] = 0;
                    if (mode === 'swap' && i < out.length - 1) {
                        let temp = out[i]; out[i] = out[i+1]; out[i+1] = temp;
                    }
                }
            }
            return out;
        }

        document.getElementById('playBtn').addEventListener('click', () => {
            if (!romBytes) return alert("Please select a .nes file first!");
            
            log.innerText += "\nCorrupting and loading...";
            const glitchedRom = corrupt(romBytes);
            
            let romStr = "";
            for (let i = 0; i < glitchedRom.length; i++) romStr += String.fromCharCode(glitchedRom[i]);

            canvas.style.display = 'block';
            
            nes = new jsnes.NES({
                onFrame: (buffer) => {
                    for (let i = 0; i < 256 * 240; i++) {
                        let p = buffer[i], idx = i * 4;
                        imgData.data[idx] = p & 0xFF;
                        imgData.data[idx+1] = (p >> 8) & 0xFF;
                        imgData.data[idx+2] = (p >> 16) & 0xFF;
                        imgData.data[idx+3] = 0xFF;
                    }
                    ctx.putImageData(imgData, 0, 0);
                }
            });

            try {
                nes.loadROM(romStr);
                log.innerText = "Playing! Use your keyboard (Arrows, Z, X, Enter).";
                const loop = () => { nes.frame(); requestAnimationFrame(loop); };
                requestAnimationFrame(loop);
            } catch(e) {
                log.innerText = "Error: The corruption broke the ROM completely (not a valid NES file anymore).";
            }
        });

        // Keyboard Controls
        const keys = { 'ArrowUp': 4, 'ArrowDown': 5, 'ArrowLeft': 6, 'ArrowRight': 7, 'Enter': 3, 'z': 0, 'x': 1 };
        document.addEventListener('keydown', (e) => { if (nes && keys[e.key] !== undefined) nes.buttonDown(1, keys[e.key]); });
        document.addEventListener('keyup', (e) => { if (nes && keys[e.key] !== undefined) nes.buttonUp(1, keys[e.key]); });
    </script>
</body>
</html>
