<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROM Corruptor</title>
    
    <!-- Google Fonts for Modern UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- jsnes Emulator Library -->
    <script src="https://cdn.jsdelivr.net/npm/jsnes@1.2.1/dist/jsnes.min.js"></script>

    <style>
        :root {
            --bg-color: #0a0a0f;
            --panel-bg: rgba(20, 20, 30, 0.7);
            --border-color: #2a2a3a;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-cyan: #00f3ff;
            --accent-pink: #ff00ea;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 243, 255, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 0, 234, 0.08), transparent 25%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            margin-top: 20px;
        }

        h1 {
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 24px;
            text-align: center;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input[type="file"] {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input[type="file"]:focus { border-color: var(--accent-cyan); }

        input[type="file"]::file-selector-button {
            background: var(--border-color);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            margin-right: 12px;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, rgba(0,243,255,0.15), rgba(255,0,234,0.15));
            border: 1px solid var(--accent-cyan);
            border-radius: 8px;
            color: var(--accent-cyan);
            font-weight: 800;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
            margin-bottom: 20px;
        }

        button:hover {
            background: linear-gradient(90deg, rgba(0,243,255,0.3), rgba(255,0,234,0.3));
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
        }

        .terminal-output {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid var(--accent-pink);
            font-size: 13px;
            margin-bottom: 20px;
            word-break: break-all;
            color: #a7f3d0;
            display: none;
        }

        .emulator-container {
            display: none;
            width: 100%;
            margin-top: 20px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }

        canvas {
            width: 100% !important;
            height: auto !important;
            display: block;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>ROM Corruptor</h1>

        <label>1. Select Target Console</label>
        <select id="systemSelect">
            <option value="NES">NES (.nes)</option>
            <option value="SNES">SNES (.sfc / .smc)</option>
            <option value="PS1">PlayStation 1 (.iso / .bin)</option>
            <option value="PS2">PlayStation 2 (.iso)</option>
            <option value="PS3">PlayStation 3 (.iso / .pkg)</option>
            <option value="Wii">Nintendo Wii (.iso / .wbfs)</option>
            <option value="Switch">Nintendo Switch (.nsp / .xci)</option>
        </select>

        <label>2. Choose Game File</label>
        <input type="file" id="fileInput" accept=".nes,.sfc,.smc,.iso,.bin,.pkg,.wbfs,.nsp,.xci">

        <label>3. Glitch Engine Mode</label>
        <select id="engineSelect">
            <option value="randomize">Randomize Bytes</option>
            <option value="zero">Zero-Out</option>
            <option value="increment">Increment Shift</option>
            <option value="swap">Byte Swap Engine</option>
        </select>

        <button id="actionBtn">Corrupt & Play Live</button>

        <div id="terminal" class="terminal-output"></div>

        <div id="emulatorContainer" class="emulator-container">
            <canvas id="nes-canvas" width="256" height="240"></canvas>
        </div>
    </div>

    <script>
        let currentRomBytes = null;
        let fileName = "";
        
        // Emulator Variables
        let nes = null;
        let canvas = document.getElementById('nes-canvas');
        let ctx = canvas.getContext('2d');
        let imageData = ctx.createImageData(256, 240);

        const terminal = document.getElementById('terminal');
        const emulatorContainer = document.getElementById('emulatorContainer');

        // 1. READ FILE (Fixed arrayBuffer error)
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            fileName = file.name;
            terminal.style.display = 'block';
            terminal.textContent = "Reading file...";

            try {
                const romArrayBuffer = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (ev) => resolve(ev.target.result);
                    reader.onerror = (ev) => reject(ev.target.error);
                    reader.readAsArrayBuffer(file);
                });

                currentRomBytes = new Uint8Array(romArrayBuffer);
                terminal.textContent = `Loaded: ${fileName}\nSize: ${(currentRomBytes.length / 1024).toFixed(2)} KB\nReady to corrupt.`;

            } catch (err) {
                terminal.textContent = "Error: Could not read file.\n" + err.message;
            }
        });

        // 2. CORRUPTION ENGINES
        function applyCorruption(bytes, engine) {
            let corrupted = new Uint8Array(bytes); // Clone
            
            // Skip NES iNES header (first 16 bytes)
            const startOffset = (document.getElementById('systemSelect').value === 'NES') ? 16 : 0;
            const length = corrupted.length;

            if (engine === 'randomize') {
                for (let i = startOffset; i < length; i++) {
                    if (Math.random() < 0.1) { // 10% chance
                        corrupted[i] = Math.floor(Math.random() * 256);
                    }
                }
            } 
            else if (engine === 'zero') {
                for (let i = startOffset; i < length; i++) {
                    if (Math.random() < 0.05) corrupted[i] = 0;
                }
            }
            else if (engine === 'increment') {
                for (let i = startOffset; i < length; i++) {
                    if (Math.random() < 0.1) corrupted[i] = (corrupted[i] + 1) % 256;
                }
            }
            else if (engine === 'swap') {
                for (let i = startOffset; i < length - 1; i += 2) {
                    if (Math.random() < 0.1) {
                        let temp = corrupted[i];
                        corrupted[i] = corrupted[i+1];
                        corrupted[i+1] = temp;
                    }
                }
            }
            return corrupted;
        }

        // 3. EMULATOR & PLAY BUTTON
        document.getElementById('actionBtn').addEventListener('click', () => {
            if (!currentRomBytes) {
                alert("Please select a ROM file first!");
                return;
            }

            const system = document.getElementById('systemSelect').value;
            const engine = document.getElementById('engineSelect').value;
            
            terminal.textContent = `Applying ${engine} to ${system} ROM...`;
            const corruptedBytes = applyCorruption(currentRomBytes, engine);

            if (system === 'NES') {
                playNes(corruptedBytes);
                terminal.textContent += "\n\nLoading into jsnes Emulator... (Click Canvas to play)";
            } 
            else if (system === 'PS2' || system === 'PS3' || system === 'Wii' || system === 'Switch') {
                terminal.textContent += `\n\nWARNING: ${system} games are encrypted containers. Scrambling bytes will likely make the file unbootable. (Emulator not supported).`;
            } 
            else {
                terminal.textContent += "\n\nCorruption complete. Emulator only supports NES. Download feature coming soon.";
            }
        });

        // 4. JS NES SETUP
        function playNes(bytes) {
            emulatorContainer.style.display = 'block';
            
            let romString = "";
            for (let i = 0; i < bytes.length; i++) {
                romString += String.fromCharCode(bytes[i]);
            }

            nes = new jsnes.NES({
                onFrame: function(frameBuffer) {
                    for (let i = 0; i < 256 * 240; i++) {
                        let pixel = frameBuffer[i];
                        let idx = i * 4;
                        imageData.data[idx + 0] = pixel & 0xFF;
                        imageData.data[idx + 1] = (pixel >> 8) & 0xFF;
                        imageData.data[idx + 2] = (pixel >> 16) & 0xFF;
                        imageData.data[idx + 3] = 0xFF;
                    }
                    ctx.putImageData(imageData, 0, 0);
                },
                onAudioSample: function(left, right) {}
            });

            try {
                nes.loadROM(romString);
                requestAnimationFrame(frameRunner);
            } catch (e) {
                terminal.textContent = "Emulator Error: Invalid NES ROM file.";
            }
        }

        let lastTime = 0;
        function frameRunner(time) {
            if (time - lastTime > 16) { // ~60fps
                nes.frame();
                lastTime = time;
            }
            requestAnimationFrame(frameRunner);
        }

        // 5. CONTROLS
        const keymap = {
            'ArrowUp': jsnes.Controller.BUTTON_UP,
            'ArrowDown': jsnes.Controller.BUTTON_DOWN,
            'ArrowLeft': jsnes.Controller.BUTTON_LEFT,
            'ArrowRight': jsnes.Controller.BUTTON_RIGHT,
            'Enter': jsnes.Controller.BUTTON_START,
            'Shift': jsnes.Controller.BUTTON_SELECT,
            'z': jsnes.Controller.BUTTON_A,
            'x': jsnes.Controller.BUTTON_B
        };

        document.addEventListener('keydown', (e) => {
            if (nes && keymap[e.key]) {
                nes.buttonDown(1, keymap[e.key]);
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (nes && keymap[e.key]) {
                nes.buttonUp(1, keymap[e.key]);
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
