<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROM Corrupter</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ROM Corrupter">
<meta name="theme-color" content="#141413">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23c2362b'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' font-family='monospace' fill='white'%3E%3F%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f3ef;--fg:#1d1c1a;--mut:#6a665f;--card:#fff;--bd:#d8d4cb;--ac:#c2362b;--acfg:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--fg:#ecebe6;--mut:#9b978f;--card:#1e1d1b;--bd:#35332f;--ac:#e0584c;--acfg:#14110f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--fg:#ecebe6;--mut:#9b978f;--card:#1e1d1b;--bd:#35332f;--ac:#e0584c;--acfg:#14110f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 16px 40px}
main{max-width:560px;margin:0 auto}
h1{font:700 1.5rem/1.2 ui-monospace,Menlo,Consolas,monospace;margin:0 0 4px}
p.s{color:var(--mut);margin:0 0 18px;font-size:.9rem}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.8rem;color:var(--mut);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
label:first-child{margin-top:0}
select,input[type=text],input[type=file]{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px}
input[type=range]{width:100%;accent-color:var(--ac)}
.r{display:flex;gap:8px}
button{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);padding:10px 14px;cursor:pointer}
button.p{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
button:disabled{opacity:.45;cursor:default}
.k{font:.85rem/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--mut);margin-top:10px;word-break:break-word}
canvas{width:100%;height:28px;display:block;margin-top:10px;border-radius:6px;background:var(--bg);border:1px solid var(--bd)}
.n{font-size:.8rem;color:var(--mut)}
</style></head>
<body><main>
<h1>ROM CORRUPTER</h1>
<p class="s">NES + SNES glitch tool. Works offline, nothing is uploaded. Use ROMs you own.</p>

<div class="c">
<label for="f">ROM file (.nes / .sfc / .smc)</label>
<input type="file" id="f">
<div class="k" id="inf">No file loaded.</div>
</div>

<div class="c" id="ctl" hidden>
<label for="reg">Region</label><select id="reg"></select>
<label for="mode">Corruption mode</label>
<select id="mode">
<option value="mix">Chaos mix</option>
<option value="rand">Random bytes</option>
<option value="flip">Bit flips</option>
<option value="step">Nudge +1 / −1</option>
<option value="swap">Swap neighbours</option>
<option value="fill">Fill runs (00 / FF)</option>
<option value="copy">Copy blocks</option>
</select>
<label for="amt">Intensity: <span id="pct"></span></label>
<input type="range" id="amt" min="-3" max="1" step="0.05" value="-1.5">
<label for="seed">Seed</label>
<div class="r"><input type="text" id="seed" autocapitalize="off" autocomplete="off"><button id="roll" type="button">Re-roll</button></div>
<canvas id="map" width="512" height="28"></canvas>
<div class="k" id="stat"></div>
</div>

<div class="c" id="sv" hidden>
<div class="r"><button class="p" id="bz" type="button" style="flex:1">Save corrupted ROM</button><button id="bt" type="button" style="flex:1">Share</button></div>
<p class="n" style="margin:10px 0 0">Header bytes are never touched. Many corruptions just crash, so keep re-rolling or lower the intensity.</p>
<div class="k" id="msg"></div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
let rom=null,info=null,out=null,name='rom.bin';

function detect(b,fn){
  const ext=fn.split('.').pop().toLowerCase();
  if(b[0]==0x4E&&b[1]==0x45&&b[2]==0x53&&b[3]==0x1A){
    const hdr=16+(b[6]&4?512:0),prg=b[4]*16384,chr=b[5]*8192;
    const r=[['Whole ROM (skip header)',hdr,b.length-hdr]];
    if(prg&&hdr+prg<=b.length)r.push(['PRG only (code: crashes, odd behaviour)',hdr,prg]);
    if(chr&&hdr+prg+chr<=b.length)r.push(['CHR only (graphics glitches)',hdr+prg,chr]);
    return{sys:'NES (iNES)'+(chr?'':', CHR-RAM'),hdr,regions:r};
  }
  const hdr=b.length%1024==512?512:0;
  const snes=['sfc','smc','swc','fig'].includes(ext)||hdr==512||b.length%32768==0;
  return{sys:snes?'SNES'+(hdr?' (512-byte copier header)':''):'Unknown format (treated as raw)',hdr,regions:[['Whole ROM'+(hdr?' (skip header)':''),hdr,b.length-hdr]]};
}

function rng(s){
  let h=1779033703^s.length;
  for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  let a=h|0;
  return()=>{a=(a+0x6D2B79F5)|0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}
}

function run(){
  if(!rom)return;
  const[,st,len]=info.regions[+$('reg').value],end=st+len;
  const R=rng($('seed').value),pct=Math.pow(10,+$('amt').value);
  $('pct').textContent=(pct<1?pct.toFixed(3):pct.toFixed(1))+'% of region';
  const n=Math.max(1,Math.round(len*pct/100)),m=$('mode').value;
  const modes=['rand','flip','step','swap','fill','copy'];
  out=rom.slice();
  for(let k=0;k<n;k++){
    const md=m=='mix'?modes[Math.floor(R()*modes.length)]:m;
    const i=st+Math.floor(R()*len);
    if(md=='rand')out[i]=R()*256;
    else if(md=='flip')out[i]^=1<<Math.floor(R()*8);
    else if(md=='step')out[i]+=R()<.5?1:-1;
    else if(md=='swap'){if(i+1<end){const t=out[i];out[i]=out[i+1];out[i+1]=t}}
    else if(md=='fill'){out.fill(R()<.5?0:255,i,Math.min(i+1+Math.floor(R()*16),end))}
    else if(md=='copy'){const s=st+Math.floor(R()*len),e=Math.min(1+Math.floor(R()*32),end-s,end-i);if(e>0)out.set(rom.subarray(s,s+e),i)}
  }
  const B=new Uint32Array(512);let d=0;
  for(let i=0;i<rom.length;i++)if(rom[i]!==out[i]){d++;B[Math.floor(i*512/rom.length)]++}
  $('stat').textContent=d.toLocaleString()+' of '+rom.length.toLocaleString()+' bytes changed';
  const cv=$('map'),x=cv.getContext('2d');
  x.clearRect(0,0,512,28);
  x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--ac');
  const mx=Math.max(1,...B);
  for(let i=0;i<512;i++)if(B[i]){const h=Math.max(3,28*Math.sqrt(B[i]/mx));x.fillRect(i,28-h,1,h)}
}

function newSeed(){$('seed').value=Math.random().toString(36).slice(2,8)}
function msg(t){$('msg').textContent=t}

$('f').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    rom=new Uint8Array(await f.arrayBuffer());name=f.name;info=detect(rom,name);
    $('inf').textContent=name+' · '+(rom.length/1024).toFixed(0)+' KB · '+info.sys+' · header '+info.hdr+' B';
    $('reg').innerHTML='';
    info.regions.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=r[0];$('reg').appendChild(o)});
    $('ctl').hidden=false;$('sv').hidden=false;msg('');newSeed();run();
  }catch(err){$('inf').textContent='Could not read that file.'}
});
['reg','mode','amt','seed'].forEach(id=>$(id).addEventListener('input',run));
$('roll').addEventListener('click',()=>{newSeed();run()});

function fname(){
  const i=name.lastIndexOf('.'),base=(i>0?name.slice(0,i):name),ext=i>0?name.slice(i):'.bin';
  const sd=($('seed').value.replace(/[^a-z0-9]/gi,'')||'x').slice(0,12);
  return base+'_corrupt_'+sd+ext;
}
const native=()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
async function nativeSave(){
  try{
    const P=window.Capacitor.Plugins;let bin='';
    for(let i=0;i<out.length;i+=0x8000)bin+=String.fromCharCode.apply(null,out.subarray(i,i+0x8000));
    const r=await P.Filesystem.writeFile({path:fname(),data:btoa(bin),directory:'CACHE'});
    await P.Share.share({title:fname(),url:r.uri});
    msg('Pick "Save to Files" or an emulator app.');
  }catch(e){if(!e||!/cancel/i.test(String(e.message||e)))msg('Could not save: '+(e&&e.message||e))}
}
function save(){
  if(!out)return;
  if(native())return nativeSave();
  const url=URL.createObjectURL(new Blob([out],{type:'application/octet-stream'}));
  const a=document.createElement('a');a.href=url;a.download=fname();
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  msg('Saved as '+fname());
}
async function share(){
  if(!out)return;
  if(native())return nativeSave();
  try{
    const f=new File([out],fname(),{type:'application/octet-stream'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});msg('Shared.')}
    else{save()}
  }catch(e){if(!e||e.name!=='AbortError')save()}
}
$('bz').addEventListener('click',save);
$('bt').addEventListener('click',share);
</script>
</body></html>
